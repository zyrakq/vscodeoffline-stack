services:
  vscodeoffline:
    environment:
      VIRTUAL_PORT: ${VIRTUAL_PORT:}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - letsencrypt-certs:/certs
    networks:
      - letsencrypt-network
    configs:
      - source: vscodeoffline-mtls
        target: /etc/ferron.d/mtls/vautls.kdl
volumes:
  letsencrypt-certs:
    external: true
networks:
  letsencrypt-network:
    external: true
configs:
  vscodeoffline-mtls:
    content: |-
      * {
          tls_client_certificate "${TLS_CLIENT_CERTIFICATE:-/app/data/ca/ca-tls.cert}"
      }
